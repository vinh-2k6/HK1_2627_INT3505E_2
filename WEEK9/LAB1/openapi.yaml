openapi: 3.0.3
info:
  title: User API (URI Path Versioning)
  version: 2.0.0
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/v1/users/{id}:
    get:
      summary: Get user by ID (v1 - Deprecated)
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found (v1 schema)
          headers:
            Sunset:
              description: Thời điểm v1 ngừng hoạt động
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
        "404":
          description: User not found

  /api/v2/users/{id}:
    get:
      summary: Get user by ID (v2)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found (v2 schema)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2"
        "404":
          description: User not found

  /api/v2/users:
    post:
      summary: Create a new user (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateV2"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2"
        "400":
          description: Missing required fields

components:
  schemas:
    UserV1:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
    UserV2:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
    UserCreateV2:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string